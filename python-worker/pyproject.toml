[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "next-react-chat-worker"
version = "0.1.0"
description = "FastAPI worker for chat messages queued by the Next.js app"
requires-python = ">=3.10"
dependencies = [
  "aio-pika>=9.4,<10.0",
  "fastapi>=0.115,<1.0",
  "httpx>=0.27,<1.0",
  "psycopg[binary]>=3.2,<4.0",
  "python-dotenv>=1.0,<2.0",
  "sqlglot>=26,<32",
  "uvicorn[standard]>=0.30,<1.0",
]
