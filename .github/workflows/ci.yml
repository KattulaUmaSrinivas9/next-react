
name: CI - Build

on:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate application steps
    if: github.actor == 'KattulaUmaSrinivas9' && github.triggering_actor == 'KattulaUmaSrinivas9'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: TypeScript type checking
        run: npm run typecheck

      - name: Run Jest tests
        run: npm run test:coverage -- --ci

      - name: Install client-only dependency
        run: npm install client-only

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build Vercel production artifact
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Verify Vercel build output
        shell: bash
        run: |
          set -euo pipefail

          test -d .vercel/output || {
            echo "ERROR: Vercel output directory was not generated."
            exit 1
          }

          echo "Checking for hidden function configuration..."
          if [[ -f .vercel/output/functions/_global-error.func/.vc-config.json ]]; then
            echo "Global error function configuration found."
          else
            echo "Global error function configuration not found at the expected path."
          fi

          echo "Checking for client-only dependency in output..."
          find .vercel/output -path '*/node_modules/client-only/index.js' -print || true

          echo "Vercel output verification completed."

      - name: Upload Vercel artifact
        uses: actions/upload-artifact@v4
        with:
          name: vercel-output-${{ github.sha }}
          path: .vercel/output/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
